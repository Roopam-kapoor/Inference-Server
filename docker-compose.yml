services:
  model-server:
    build: ./model-server
    image: ${DOCKER_REGISTRY:-docker.io}/${IMAGE_PREFIX}-model-server:${TAG}
    volumes:
      - ./models/all-MiniLM-L6-v2:/model
    environment:
      - MODEL_PATH=${MODEL_PATH}
    networks:
      - llm-network

  gateway:
    build: ./gateway
    image: ${DOCKER_REGISTRY:-docker.io}/${IMAGE_PREFIX}-gateway:${TAG}
    environment:
      - MODEL_SERVER_URL=${MODEL_SERVER_URL}
      - API_KEY=${API_KEY}
    depends_on:
      - model-server
    networks:
      - llm-network

  nginx:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge